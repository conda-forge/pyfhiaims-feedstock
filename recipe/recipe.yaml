schema_version: 1

context:
  name: pyfhiaims
  version: '1.2'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyfhiaims-${{ version }}.tar.gz
  sha256: 28e53d6457b578762e7d7af2c3f1cda5f886b837469f3b1ccad2cd06a207ed6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - numpy
    - versioningit >=1.0,<2.dev0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - monty >=2024.10.21
tests:
  - python:
      imports:
        - pyfhiaims
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An FHI-aims official Python package
  license: MIT
  license_file: LICENSE
  homepage: https://fhi-aims-club.gitlab.io/pyfhiaims/

extra:
  recipe-maintainers:
    - jan-janssen
